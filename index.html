<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema escolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EF;--surface:#FFFFFF;--surface2:#E4EAE6;--ink:#17262F;--muted:#56666E;--line:#CFD8D3;
  --band:#1F4A40;--band2:#183B33;--band-ink:#F1F5EE;--band-muted:#B7C9C0;
  --pri:#1F5C4E;--pri-ink:#FFFFFF;--acc:#E4B43A;
  --ok:#2A7447;--okbg:#DCEFE2;--bad:#AE3B28;--badbg:#F7DFD8;--warn:#98680C;--warnbg:#F6EACB;--info:#2D5A86;--infobg:#DDE8F3;
  --fh:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --fb:'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1618;--surface:#162125;--surface2:#1D2B30;--ink:#E2EAE6;--muted:#97A7A2;--line:#2A3A3F;
    --band:#143530;--band2:#102A26;--band-ink:#EAF1EC;--band-muted:#94AFA5;
    --pri:#52B296;--pri-ink:#08201A;
    --ok:#72C48F;--okbg:#1A3526;--bad:#EC8C78;--badbg:#42221C;--warn:#E2B55B;--warnbg:#3A2F17;--info:#8DB8E3;--infobg:#1B2C3D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1618;--surface:#162125;--surface2:#1D2B30;--ink:#E2EAE6;--muted:#97A7A2;--line:#2A3A3F;
  --band:#143530;--band2:#102A26;--band-ink:#EAF1EC;--band-muted:#94AFA5;
  --pri:#52B296;--pri-ink:#08201A;
  --ok:#72C48F;--okbg:#1A3526;--bad:#EC8C78;--badbg:#42221C;--warn:#E2B55B;--warnbg:#3A2F17;--info:#8DB8E3;--infobg:#1B2C3D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--fh);margin:0;line-height:1.15}
h1{font-size:clamp(24px,3.2vw,30px);font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700}
.sub{margin:4px 0 0;color:var(--muted)}
.muted{color:var(--muted)}
small{font-size:13px}

/* Banda superior (pizarra) */
.band{background:var(--band);color:var(--band-ink)}
.band-in{max-width:1280px;margin:0 auto;padding:16px 20px 10px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}
.bn{font-family:var(--fh);font-weight:700;font-size:21px;line-height:1.1}
.bs{color:var(--band-muted);font-size:14px}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who select{background:var(--band2);border:1px solid rgba(255,255,255,.18);color:var(--band-ink);border-radius:6px;padding:6px 10px}
.who .lk{background:none;border:0;color:var(--band-ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.live{font-size:13px;color:var(--band-muted);display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--band-muted)}
.live.on::before{background:#7BE0A6;box-shadow:0 0 0 3px rgba(123,224,166,.2)}
nav#nav{max-width:1280px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav#nav::-webkit-scrollbar{display:none}
nav#nav button{background:none;border:0;color:var(--band-muted);padding:10px 12px 12px;cursor:pointer;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
nav#nav button:hover{color:var(--band-ink)}
nav#nav button[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--acc)}

main{max-width:1280px;margin:0 auto;padding:24px 20px 80px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar input[type=search]{flex:1 1 240px;min-width:0}

.btn{background:var(--pri);color:var(--pri-ink);border:1px solid var(--pri);border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2);filter:none}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--line)}
.btn.link{background:none;border:0;color:var(--pri);padding:4px 6px;text-decoration:underline;text-underline-offset:3px}
.back{background:none;border:0;color:var(--muted);padding:0;margin-bottom:6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
select{width:auto;max-width:100%}
.bar select,.bar input[type=date]{width:auto}
textarea{resize:vertical;min-height:40px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
label.f > input,label.f > select,label.f > textarea{font-weight:400;color:var(--ink);width:100%}
label.ck{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--pri)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.span2{grid-column:auto}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:16px 18px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.nowrap{white-space:nowrap}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.info{background:var(--infobg);color:var(--info)}
.empty{padding:40px 20px;text-align:center;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.empty p{margin:0 0 14px;color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--pri)}

/* Panel */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:22px}
.stat{padding:16px 18px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-family:var(--fh);font-size:34px;line-height:1;margin-bottom:6px}
.stat span{color:var(--muted);font-size:14px}
.stat.alert b{color:var(--bad)}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:22px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:center}
.list li:last-child{border-bottom:0}
.feed li{display:block}
.feed .fm{font-size:13px;color:var(--muted)}
.steps{margin:0;padding-left:20px}
.steps li{margin:6px 0}

/* Asistencia */
.asis-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line)}
.asis-row:last-child{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-shrink:0}
.seg button{background:var(--surface);border:0;border-left:1px solid var(--line);padding:6px 11px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.seg button:first-child{border-left:0}
.seg button.on.v-P{background:var(--ok);color:#fff}
.seg button.on.v-A{background:var(--bad);color:#fff}
.seg button.on.v-T{background:var(--warn);color:#fff}
.seg button.on.v-J{background:var(--info);color:#fff}
.short{display:none}
@media (max-width:560px){.full{display:none}.short{display:inline}}
.sticky-foot{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;box-shadow:0 -6px 18px rgba(0,0,0,.06)}
.cnt{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.cnt b{font-family:var(--fh)}

/* Pagos */
.pg th,.pg td{padding:7px 6px;text-align:center}
.pg th:nth-child(2),.pg td:nth-child(2){text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:190px;padding-left:12px}
.mc{width:52px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.mc.st-pagado{background:var(--okbg);border-color:transparent;color:var(--ok)}
.mc.st-atrasado{background:var(--badbg);border-color:transparent;color:var(--bad)}
.mc.st-pendiente{background:var(--warnbg);border-color:transparent;color:var(--warn)}
.mc.st-na{opacity:.4;cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}

/* Editor de examen */
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1050px){.ed{grid-template-columns:1fr}.ed-prev{position:static!important}}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.blk > header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.blk > header .acts{gap:4px}
.pq{border-top:1px solid var(--line);padding:12px 0 4px}
.pq-h{display:grid;grid-template-columns:28px minmax(0,1fr) 84px 34px;gap:8px;align-items:start}
.pq-h .num{font-family:var(--fh);font-weight:700;padding-top:8px;text-align:right}
.pts{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.pts input{padding:6px 8px!important}
.x{background:none;border:1px solid transparent;border-radius:6px;width:34px;height:34px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.x:hover{border-color:var(--line);color:var(--bad)}
.pq-b{margin:8px 0 6px 36px;display:grid;gap:6px}
.op{display:grid;grid-template-columns:22px 22px minmax(0,1fr) 30px;gap:6px;align-items:center}
.op span{font-weight:600;color:var(--muted)}
.addserie{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:14px 0}
.ed-prev{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.prev-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.papel-wrap{overflow:auto;max-height:78vh;border-radius:10px;background:var(--surface2);padding:14px}
.papel{background:#fff;color:#000;padding:36px 40px;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:816px;margin:0 auto}
.papel .hoja + .hoja{margin-top:40px;padding-top:40px;border-top:2px dashed #bbb}

/* Diálogo */
dialog{border:0;border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(1000px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,20,18,.5)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
dialog header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.dlg-b{padding:18px 20px;overflow:auto;display:grid;gap:12px}
dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
dialog footer .grow{margin-right:auto}
.note{font-size:14px;color:var(--muted);margin:0}
.box{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:14px}
.gl li{padding:8px 0}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100vw - 32px);font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* ===== Documento imprimible (siempre blanco) ===== */
.doc{font-family:'Source Sans 3',Arial,sans-serif;color:#000;background:#fff;font-size:11.5pt;line-height:1.38}
.doc .enc{display:grid;grid-template-columns:78px 1fr 78px;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
.doc .enc img{max-width:78px;max-height:78px;object-fit:contain}
.doc .enc .c{text-align:center}
.doc .enc .n{font-size:16pt;font-weight:700;line-height:1.15}
.doc .enc .l{font-size:9.5pt}
.doc .enc .lema{font-size:9.5pt;font-style:italic}
.doc .tit{text-align:center;margin:6px 0 10px}
.doc .t1{font-size:13.5pt;font-weight:700;text-transform:uppercase}
.doc .t2{font-size:11pt}
.doc .campos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 18px;margin:10px 0 12px;font-size:10.5pt}
.doc .campo{display:flex;gap:6px;align-items:flex-end}
.doc .campo b{white-space:nowrap}
.doc .campo .ln{flex:1;border-bottom:1px solid #000;min-height:17px;padding:0 4px}
.doc .campo.full{grid-column:1/-1}
.doc .ig{margin:6px 0 10px;font-size:10.5pt}
.doc .serie{margin:14px 0 6px;break-inside:auto}
.doc .sh{margin-bottom:6px;font-size:11pt}
.doc .sh .val{white-space:nowrap}
.doc ol.pl{margin:0;padding-left:24px}
.doc ol.pl > li{margin:0 0 9px;break-inside:avoid;page-break-inside:avoid}
.doc .ops{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin-top:3px}
.doc .ops.one{grid-template-columns:1fr}
.doc .blank{display:inline-block;min-width:90px;border-bottom:1px solid #000;text-align:center;padding:0 4px;line-height:1.1}
.doc .vfb{display:inline-block;min-width:44px;border-bottom:1px solid #000;text-align:center;margin-right:8px}
.doc .rg{border-bottom:1px solid #777;height:24px}
.doc .resp{color:#B00000;font-weight:700}
.doc .ops .resp{text-decoration:underline}
.doc .pareo{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.doc .pareo ol,.doc .pareo ul{margin:0;padding-left:0;list-style:none}
.doc .pareo li{margin:0 0 8px;break-inside:avoid}
.doc .par{display:inline-block;min-width:34px;text-align:center}
.doc table.t{width:100%;border-collapse:collapse;margin:10px 0;font-size:10.5pt}
.doc table.t th,.doc table.t td{border:1px solid #000;padding:4px 7px;text-align:left}
.doc table.t .r{text-align:right}
.doc table.t .c{text-align:center}
.doc table.t tfoot td{font-weight:700}
.doc .ref{display:flex;justify-content:space-between;gap:10px;margin:4px 0 16px;flex-wrap:wrap}
.doc .asunto{font-weight:700;text-transform:uppercase}
.doc p{margin:0 0 9px}
.doc .firma{margin:56px 0 0 auto;width:250px;border-top:1px solid #000;text-align:center;padding-top:4px}
.doc .firma.izq{margin-left:0}
.doc .corte{border-top:1px dashed #000;margin:30px 0 12px;text-align:center;font-size:9pt}
.doc .corte span{background:#fff;padding:0 8px;position:relative;top:-9px}
.doc .talon{font-size:10.5pt}
.doc .talon .campos{grid-template-columns:1fr 1fr}
.doc .small{font-size:9.5pt}
.doc .rep td,.doc .rep th{padding:2px 4px!important;font-size:9pt}

#print-root{display:none}
@media print{
  @page{size:letter;margin:14mm}
  html,body{background:#fff!important;padding:0!important}
  :root{padding:0!important}
  body > *:not(#print-root){display:none!important}
  dialog,dialog::backdrop{display:none!important}
  #print-root{display:block!important}
  .doc .hoja + .hoja{break-before:page;page-break-before:always}
}
.who-n{display:flex;align-items:center;gap:8px;font-size:14px;line-height:1.2}
.who-n img{width:30px;height:30px;border-radius:50%;background:#fff}
.who-n small{display:block;color:var(--band-muted)}
.cuadro th button{background:none;border:0;padding:0;cursor:pointer;color:var(--pri);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:left;font-size:13px;white-space:normal;max-width:160px;display:block}
.cuadro th small{font-weight:400;display:block}
.cuadro .n{text-align:center}
.cuadro td.tot{font-weight:700;font-family:var(--fh)}
.low{color:var(--bad);font-weight:700}
.lock{max-width:600px;margin:40px auto}
.warnbox{background:var(--warnbg);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.infobox{background:var(--infobg);border-radius:8px;padding:12px 14px;font-size:15px;margin-bottom:16px}
.infobox p{margin:0 0 6px}.infobox p:last-child{margin:0}
.mrow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.doc .enc.sm{grid-template-columns:56px 1fr 56px;padding-bottom:5px;margin-bottom:8px;gap:8px}
.doc .enc.sm img{max-width:56px;max-height:56px}
.doc .enc.sm .n{font-size:13pt}
.doc .rb{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 8px}
.doc .rb .no{font-size:13pt;font-weight:700}
.doc .copia{font-size:8.5pt;text-transform:uppercase;letter-spacing:.06em}
.doc .letras{border:1px solid #000;padding:5px 8px;margin:6px 0;font-size:10.5pt}
.doc .firmas{display:flex;justify-content:space-around;gap:24px;margin-top:54px;flex-wrap:wrap}
.doc .firmas div{width:190px;border-top:1px solid #000;text-align:center;padding-top:4px;font-size:10pt}
.doc .reprob{color:#B00000;font-weight:700}
.doc .recibo .campos{grid-template-columns:1fr 1fr;margin:6px 0}
.doc .recibo table.t{margin:6px 0}
.doc .recibo .firma{margin-top:34px}
.login{max-width:420px;margin:7vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 26px}
.login form{display:grid;gap:14px;margin-top:20px}
.login .btn.link{justify-self:center}
.who .lk{font-size:14px}
/* Portal de alumnos */
.tcards{display:grid;gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.tcard.st-pend{border-left-color:var(--warn)}.tcard.st-ok{border-left-color:var(--ok)}.tcard.st-bad{border-left-color:var(--bad)}.tcard.st-cal{border-left-color:var(--info)}
.tcard h3{font-size:17px;margin:0 0 2px}
.tcard .meta{font-size:14px;color:var(--muted)}
.tcard .der{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.adj{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:8px;padding:8px 12px;font-size:14px;flex-wrap:wrap}
.adj a{color:var(--pri);font-weight:600}
.upbar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.upbar i{display:block;height:100%;width:0;background:var(--pri);transition:width .15s}
.ent-det summary{cursor:pointer;color:var(--pri);font-weight:600;font-size:14px}
.ent-det div{font-size:14px;margin-top:4px;max-width:340px;overflow-wrap:anywhere}
.ent-det a{color:var(--pri)}
input[type=color]{width:56px!important;height:40px;padding:2px!important;cursor:pointer}
</style>
</head>
<body>
<header class="band">
  <div class="band-in">
    <div class="brand">
      <img id="brandLogo" alt="" hidden>
      <div><div class="bn" id="brandName">Sistema escolar</div><div class="bs" id="brandSub">Cargando…</div></div>
    </div>
    <div class="who" id="who"></div>
  </div>
  <nav id="nav" aria-label="Secciones"></nav>
</header>
<main id="view"><p class="muted">Cargando…</p></main>

<dialog id="dlg" aria-labelledby="dlgT">
  <form id="dlgForm" novalidate>
    <header><h2 id="dlgT"></h2><button type="button" class="x" data-act="cerrar" aria-label="Cerrar">×</button></header>
    <div class="dlg-b" id="dlgB"></div>
    <footer id="dlgF"></footer>
  </form>
</dialog>
<dialog id="cfm" aria-labelledby="cfmT">
  <form id="cfmForm">
    <header><h2 id="cfmT">Confirmar</h2></header>
    <div class="dlg-b"><p id="cfmM" style="margin:0"></p></div>
    <footer><button type="button" class="btn ghost" id="cfmNo">Cancelar</button><button type="submit" class="btn" id="cfmSi">Sí</button></footer>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print-root" class="doc"></div>

<script>
/* ================= Utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hb=s=>h(s).replace(/\n/g,'<br>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES_C=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const ROM=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV'];
const LETRAS='abcdefghijklmnopqrstuvwxyz';
const pad=n=>String(n).padStart(2,'0');
const isoDe=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoyISO=()=>isoDe(new Date());
const sumarDias=(iso,n)=>{const[y,m,d]=iso.split('-').map(Number);return isoDe(new Date(y,m-1,d+n))};
const fechaLarga=iso=>{if(!iso)return'';const[y,m,d]=iso.split('-').map(Number);return `${d} de ${MESES[m-1].toLowerCase()} de ${y}`};
const fechaCorta=iso=>{if(!iso)return'';const[y,m,d]=iso.split('-').map(Number);return `${d} ${MES_C[m-1].toLowerCase()} ${y}`};
const money=n=>'Q'+Number(n||0).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2});
const horaDe=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
const hace=ms=>{if(!ms)return'';const s=(Date.now()-ms)/1000;if(s<60)return'hace un momento';const m=Math.floor(s/60);if(m<60)return`hace ${m} min`;const hh=Math.floor(m/60);if(hh<24)return`hace ${hh} h`;const d=Math.floor(hh/24);return d===1?'ayer':`hace ${d} días`};
const listaY=a=>a.length<=1?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];
const slug=s=>String(s||'documento').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'documento';
const clone=o=>JSON.parse(JSON.stringify(o));
const fmt=n=>n==null||n===''?'':(Math.round(n*10)/10).toString();
const esNum=x=>x!==''&&x!=null&&!isNaN(x);
function hashStr(s){let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)}return x>>>0}
function rng(seed){let a=seed||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function letras(n){
  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const m1000=x=>{if(!x)return'';if(x===100)return'cien';const c=Math.floor(x/100),r=x%100;let s=C[c];if(r)s+=(s?' ':'')+(r<30?U[r]:D[Math.floor(r/10)]+(r%10?' y '+U[r%10]:''));return s};
  if(!n)return'cero';
  const mi=Math.floor(n/1e6),k=Math.floor(n%1e6/1000),r=n%1000,o=[];
  if(mi)o.push(mi===1?'un millón':m1000(mi).replace(/uno$/,'un')+' millones');
  if(k)o.push(k===1?'mil':m1000(k).replace(/veintiuno$/,'veintiún').replace(/uno$/,'un')+' mil');
  if(r)o.push(m1000(r));
  return o.join(' ');
}
function montoLetras(x){const e=Math.floor(x+1e-9),c=Math.round((x-e)*100);if(e===1)return`UN QUETZAL CON ${pad(c)}/100`;return(letras(e).replace(/veintiuno$/,'veintiún').replace(/uno$/,'un')).toUpperCase()+` QUETZALES CON ${pad(c)}/100`}

let toastT;
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='show'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className=err?'err':'',err?5000:2600)}
function msgErr(e){
  const c=String((e&&e.code)||'');
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return'Correo o contraseña incorrectos.';
  if(c.includes('too-many-requests'))return'Demasiados intentos. Espera unos minutos e intenta de nuevo.';
  if(c.includes('email-already-in-use'))return'Ese correo ya tiene una cuenta en el sistema.';
  if(c.includes('weak-password'))return'La contraseña debe tener al menos 6 caracteres.';
  if(c.includes('invalid-email'))return'El correo no es válido.';
  if(c.includes('network-request-failed'))return'Sin conexión a internet.';
  if(c.includes('user-disabled'))return'Esta cuenta está deshabilitada.';
  if(c==='permission-denied')return'No tienes permiso para hacer este cambio, o tu acceso fue desactivado.';
  if(c==='resource-exhausted')return'Se alcanzó el límite diario del plan gratuito de la base de datos. Intenta más tarde.';
  if(c==='unavailable')return'No hay conexión con la base de datos. Revisa tu internet.';
  if(c==='failed-precondition')return'Falta crear un índice en Firestore. Abre la consola del navegador (F12): el error trae un enlace para crearlo.';
  return'No se pudo completar la operación. Intenta de nuevo.';
}
/* ================= Base de datos (Firebase) ================= */
function escribir(p){
  let listo=false;const pr=Promise.resolve(p).then(()=>{listo=true});
  return Promise.race([pr,new Promise(r=>setTimeout(r,6000))]).then(()=>{
    if(listo)return;
    if(!navigator.onLine){toast('Sin conexión: el cambio quedó en este dispositivo y se enviará al volver el internet.');pr.catch(e=>toast(msgErr(e),true));return}
    return pr;
  });
}
function errSub(e){console.error(e);toast(msgErr(e),true)}
const Store={
  col(c){return['colegios',S.cid,c]},
  sub(c,cb,wheres){return FB.sub(this.col(c),wheres||[],cb,errSub)},
  query(c,wheres){return FB.list(this.col(c),wheres||[])},
  set(c,id,data){const b=clone(data);delete b.id;return escribir(FB.set([...this.col(c),id],b))},
  del(c,id){return escribir(FB.del([...this.col(c),id]))}
};
/* Suscripciones: solo se abren cuando una pantalla las necesita */
function needQ(nombre,firma,abrir){
  const s=S.subs[nombre];if(s&&s.firma===firma)return;
  if(s&&s.unsub)s.unsub();
  S.subs[nombre]={firma,unsub:abrir()};
}
function stopAll(){Object.values(S.subs).forEach(s=>{try{s.unsub&&s.unsub()}catch(e){}});S.subs={}}
function ensureAlumnos(gid){
  if(!S.cid)return;
  if(esAdmin()){needQ('alumnos','todos',()=>Store.sub('alumnos',d=>{S.alScopes={todos:d};recomputeAl()}));return}
  if(!gid)return;
  needQ('al:'+gid,'g',()=>Store.sub('alumnos',d=>{S.alScopes[gid]=d;recomputeAl()},[['gradoId','==',gid]]));
}
function recomputeAl(){const m={};Object.values(S.alScopes).forEach(a=>a.forEach(d=>m[d.id]=d));S.alumnos=Object.values(m);scheduleRender()}
function filtroAnual(){
  const w=[['anio','==',+S.config.ciclo.anio]];
  if(!esAdmin()){const m=misCursosIds();if(m.length)w.push(['cursoId','in',m.slice(0,30)])}
  return w;
}
function needTareas(){
  if(!S.cid)return;const w=filtroAnual();
  needQ('tareas',JSON.stringify(w),()=>Store.sub('tareas',docs=>{
    if(S.seenTareas&&esAdmin())docs.forEach(t=>{if(!S.seenTareas.has(t.id)&&t.creada>S.t0&&t.autorId!==S.me.id)toast(`${nombreDe(t.autorId,'Un maestro')} publicó la tarea: ${t.titulo}`)});
    S.seenTareas=new Set(docs.map(t=>t.id));S.tareas=docs;scheduleRender();setTimeout(sincronizarCopias,1500)},w));
}
function needExamenes(){
  if(!S.cid)return;const w=filtroAnual();
  needQ('examenes',JSON.stringify(w),()=>Store.sub('examenes',docs=>{S.examenes=docs;scheduleRender()},w));
}
function needPagos(){
  if(!S.cid||!esAdmin())return;
  needQ('pagos','x',()=>Store.sub('pagos',docs=>{S.pagos=Object.fromEntries(docs.map(d=>[d.id,d]));scheduleRender()}));
}
/* Entregas en línea de los alumnos (solo se leen si el portal está activo) */
const portalOn=()=>!!(S.colegio&&S.colegio.portalAlumnos);
const archivosOn=()=>!!(S.colegio&&S.colegio.archivosAlumnos);
function needEntregas(){
  if(!S.cid||!portalOn()||esAlumno())return;const w=filtroAnual();
  needQ('entregas',JSON.stringify(w),()=>Store.sub('entregas',docs=>{
    if(S.seenEnt&&esAdmin())docs.forEach(x=>{if(x.enviada&&x.enviada>S.t0&&(S.seenEnt.get(x.id)||0)<x.enviada){const a=S.alumnos.find(y=>y.id===x.alumnoId);const t=S.tareas.find(y=>y.id===x.tareaId);toast(`${a?nomAlN(a):'Un alumno'} entregó${t?': '+t.titulo:' una tarea'}`)}});
    S.seenEnt=new Map(docs.map(x=>[x.id,x.enviada||0]));
    S.entregas=docs;scheduleRender();if(S.modal&&S.modal.kind==='entregas'&&S.modal.refrescar)S.modal.refrescar()},w));
}
const entregaDe=(tid,aid)=>S.entregas.find(x=>x.tareaId===tid&&x.alumnoId===aid);
/* Copia de la tarea sin notas: es lo único que el alumno puede leer */
function copiaAlumno(id,t){
  return{titulo:t.titulo||'',descripcion:t.descripcion||'',fechaEntrega:t.fechaEntrega||'',punteo:t.punteo??'',gradoId:t.gradoId||'',cursoId:t.cursoId||'',
    cursoNombre:cursoNom(t),unidad:Number(t.unidad)||1,anio:Number(t.anio)||+S.config.ciclo.anio,maestro:nombreDe(t.autorId,t.maestro||''),material:t.material||null,creada:t.creada||Date.now(),actualizada:Date.now()};
}
async function publicarCopia(id,t){if(!portalOn())return;await Store.set('tareasAlumnos',id,copiaAlumno(id,t))}
let sincronizando=false;
async function sincronizarCopias(){
  if(sincronizando||!portalOn()||!S.cursos.length)return;
  const falta=S.tareas.filter(t=>t.pubV!==1&&puedeEditar(t));if(!falta.length)return;
  sincronizando=true;
  try{for(const t of falta){await publicarCopia(t.id,t);await Store.set('tareas',t.id,{...t,pubV:1})}}catch(e){console.error(e)}
  sincronizando=false;
}
function subAsis(){
  if(!S.cid)return;
  needQ('asis',S.asisFecha,()=>{S.asis=[];return Store.sub('asistencia',d=>{S.asis=d;scheduleRender()},[['fecha','==',S.asisFecha]])});
}

/* ================= Configuración por defecto ================= */
const PLANTILLA=`Estimado(a) {encargado}:

Reciba un cordial saludo de parte de {colegio}. Por este medio le informamos que, según nuestros registros, el alumno(a) {alumno}, de {grado}, tiene pendiente el pago de {cantidad} cuota(s) correspondiente(s) a {meses}.

El saldo pendiente a la fecha es de {total}, que incluye la mora establecida en el reglamento del colegio. Le solicitamos ponerse al día a más tardar el {fechaLimite}, o acercarse a la administración si necesita acordar una forma de pago.

Si ya realizó el pago, le agradecemos presentar su comprobante en la administración y le pedimos disculpas por la molestia.`;
const DEF={
  colegio:{nombre:'Colegio',direccion:'',telefono:'',correo:'',lema:'',ciudad:'Guatemala',logo:'',color:'',color2:''},
  encabezadoLineas:'',
  ciclo:{anio:new Date().getFullYear(),mesInicio:1,mesFin:10},
  pagos:{cuota:350,diaLimite:10,mora:25,plazo:5},
  notas:{unidades:4,actual:1,minima:60,director:''},
  plantilla:PLANTILLA,firma:'Administración'
};
function mergeCfg(d){d=d||{};return{...DEF,...d,colegio:{...DEF.colegio,...(d.colegio||{})},ciclo:{...DEF.ciclo,...(d.ciclo||{})},pagos:{...DEF.pagos,...(d.pagos||{})},notas:{...DEF.notas,...(d.notas||{})}}}

/* ================= Estado ================= */
const S={
  view:'login',me:{id:null,nombre:'',email:'',rol:'anon'},cid:null,colegio:null,colegios:[],subs:{},bloqueoMsg:'',
  config:mergeCfg(null),grados:[],cursos:[],alumnos:[],alScopes:{},tareas:[],examenes:[],pagos:{},usuarios:[],asis:[],asisHoy:[],
  asisFecha:hoyISO(),asisGrado:'',asisDraft:null,f:{estado:'activos',soloMias:true},cGrado:'',
  examDraft:null,cfgDraft:null,sel:new Set(),modal:null,printJob:null,
  seenTareas:null,t0:Date.now(),entregas:[],seenEnt:null,miAlumno:null,tareasAl:[],misEntregas:[],misNotas:undefined
};
function resetDatos(){
  Object.assign(S,{config:mergeCfg(null),grados:[],cursos:[],alumnos:[],alScopes:{},tareas:[],examenes:[],pagos:{},usuarios:[],asis:[],asisHoy:[],entregas:[],seenEnt:null,miAlumno:null,tareasAl:[],misEntregas:[],misNotas:undefined,
    asisGrado:'',asisDraft:null,f:{estado:'activos',soloMias:true},cGrado:'',examDraft:null,cfgDraft:null,sel:new Set(),seenTareas:null,t0:Date.now()});
}
const VIEWS=[
  {id:'panel',t:'Panel',roles:['admin']},
  {id:'inscripciones',t:'Inscripciones',roles:['admin']},
  {id:'asistencia',t:'Asistencia',roles:['admin','maestro']},
  {id:'tareas',t:'Tareas',roles:['admin','maestro']},
  {id:'examenes',t:'Exámenes',roles:['admin','maestro']},
  {id:'notas',t:'Notas',roles:['admin','maestro']},
  {id:'pagos',t:'Pagos',roles:['admin']},
  {id:'usuarios',t:'Usuarios',roles:['admin']},
  {id:'config',t:'Configuración',roles:['admin']},
  {id:'misTareas',t:'Mis tareas',roles:['alumno']},
  {id:'misNotas',t:'Mis notas',roles:['alumno']}
];
const ROL_TXT={admin:'Administración',maestro:'Maestro',alumno:'Alumno',super:'Superadministrador'};
const esAdmin=()=>S.me.rol==='admin'||S.me.rol==='super';
const esAlumno=()=>S.me.rol==='alumno';
const rolVista=()=>esAdmin()?'admin':esAlumno()?'alumno':'maestro';
const vistaInicial=()=>esAdmin()?'panel':esAlumno()?'misTareas':'asistencia';
const rolDe=p=>p.rol==='admin'?'admin':p.rol==='alumno'?'alumno':'maestro';
function nombreDe(id,fallback){
  if(!id)return fallback||'';
  const u=S.usuarios.find(x=>x.id===id);if(u)return u.nombre||u.email||'Usuario';
  if(id===S.me.id)return S.me.nombre||S.me.email;
  if(id===FB.superUid)return'Soporte técnico';
  return fallback||'Usuario';
}
const yo=()=>nombreDe(S.me.id,ROL_TXT[S.me.rol]);

/* ================= Helpers de datos ================= */
const activos=()=>S.alumnos.filter(a=>a.activo!==false);
const porNombre=(a,b)=>((a.apellidos||'')+' '+(a.nombres||'')).localeCompare((b.apellidos||'')+' '+(b.nombres||''),'es');
const nomAl=a=>`${a.apellidos||''}, ${a.nombres||''}`;
const nomAlN=a=>`${a.nombres||''} ${a.apellidos||''}`.trim();
function gradoTxt(id){const g=S.grados.find(x=>x.id===id);return g?(g.nombre+(g.seccion?' '+g.seccion:'')):'Sin grado'}
function alumnosDe(gid){ensureAlumnos(gid);return activos().filter(a=>a.gradoId===gid).sort(porNombre)}
function optsGrados(sel,todos,lista){return(todos!=null?`<option value="">${h(todos)}</option>`:'')+(lista||S.grados).map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${h(gradoTxt(g.id))}</option>`).join('')}
function empty(msg,btn,act){return`<div class="empty"><p>${msg}</p>${btn?`<button class="btn" data-act="${act}">${btn}</button>`:''}</div>`}
const cursoDe=id=>S.cursos.find(c=>c.id===id);
const cursoNom=x=>(cursoDe(x.cursoId)||{}).nombre||x.curso||'';
function misCursosIds(){return S.cursos.filter(c=>c.maestroId&&c.maestroId===S.me.id).map(c=>c.id)}
function cursosVisibles(gid){
  let cs=S.cursos.filter(c=>!gid||c.gradoId===gid);
  if(!esAdmin()){const m=misCursosIds();if(m.length)cs=cs.filter(c=>m.includes(c.id))}
  return cs.sort((a,b)=>(a.orden||0)-(b.orden||0)||a.nombre.localeCompare(b.nombre,'es'));
}
function gradosVisibles(){
  if(esAdmin())return S.grados;const m=misCursosIds();if(!m.length)return S.grados;
  const gs=new Set(S.cursos.filter(c=>m.includes(c.id)).map(c=>c.gradoId));return S.grados.filter(g=>gs.has(g.id));
}
function optsCursos(gid,sel,todos){const cs=cursosVisibles(gid);return(todos!=null?`<option value="">${h(todos)}</option>`:'')+cs.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${h(c.nombre)}</option>`).join('')}
function optsUnidad(sel,todos){const n=+S.config.notas.unidades||4;let o=todos?`<option value="0" ${+sel===0?'selected':''}>${todos}</option>`:'';for(let u=1;u<=n;u++)o+=`<option value="${u}" ${+sel===u?'selected':''}>Unidad ${ROM[u-1]}</option>`;return o}
function puedeEditar(x){return esAdmin()||(x.autorId&&x.autorId===S.me.id)||(x.cursoId&&(cursoDe(x.cursoId)||{}).maestroId===S.me.id)}

function mesesCiclo(){const a=[];for(let m=+S.config.ciclo.mesInicio;m<=+S.config.ciclo.mesFin;m++)a.push(m);return a}
function cuotaDe(al){return Number(al.cuota>0?al.cuota:S.config.pagos.cuota)||0}
function estadoMes(al,m){
  const p=S.pagos[al.id]&&S.pagos[al.id].meses&&S.pagos[al.id].meses[m];
  if(p)return'pagado';
  const anio=+S.config.ciclo.anio;
  if(al.fechaIns){const[y,mm]=al.fechaIns.split('-').map(Number);if(y>anio||(y===anio&&m<mm))return'na'}

/* ======== Color del sistema a partir del logo ======== */
function hexRgb(x){const n=parseInt(String(x).slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function rgbHex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}
function rgbHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let hh=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;hh*=60}
  return[hh,s*100,l*100]}
const hsl=(H,s,l)=>`hsl(${Math.round(H)} ${Math.round(s)}% ${Math.round(l)}%)`;
const esHex=x=>/^#[0-9a-f]{6}$/i.test(String(x||''));
/* Devuelve los dos colores más fuertes del logo (ignora blanco, negro y grises) */
function coloresDeLogo(src){return new Promise(res=>{
  if(!src)return res(null);
  const im=new Image();
  im.onload=()=>{
    const n=72,cv=document.createElement('canvas');cv.width=cv.height=n;const x=cv.getContext('2d');x.drawImage(im,0,0,n,n);
    let d;try{d=x.getImageData(0,0,n,n).data}catch(e){return res(null)}
    const B=Array.from({length:24},(_,k)=>({k,w:0,r:0,g:0,b:0}));
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]<140)continue;const r=d[i],g=d[i+1],b=d[i+2];const[H,s,l]=rgbHsl(r,g,b);
      if(s<28||l<12||l>90)continue;
      const w=(s/100)*(1-Math.abs(l-50)/60);const c=B[Math.floor(H/15)%24];c.w+=w;c.r+=r*w;c.g+=g*w;c.b+=b*w;
    }
    const orden=B.filter(c=>c.w>0).sort((a,b)=>b.w-a.w);
    if(!orden.length||orden[0].w<n*n*.004)return res(null);
    const hex=c=>rgbHex(c.r/c.w,c.g/c.w,c.b/c.w);
    const top=orden[0];
    const seg=orden.find(c=>{const dk=Math.abs(c.k-top.k);return Math.min(dk,24-dk)>=3&&c.w>=top.w*.15});
    res({color:hex(top),color2:seg?hex(seg):''});
  };
  im.onerror=()=>res(null);im.src=src;
})}
function aplicarTema(color,color2){
  let el=document.getElementById('temaColegio');
  if(!el){el=document.createElement('style');el.id='temaColegio';document.head.appendChild(el)}
  if(!esHex(color)){el.textContent='';return}
  const[H,S0]=rgbHsl(...hexRgb(color));const s=Math.min(S0,70);
  let acc='';
  if(esHex(color2)){const[H2,S2]=rgbHsl(...hexRgb(color2));acc=`--acc:${hsl(H2,Math.max(55,Math.min(S2,85)),60)};`}
  const claro=`--band:${hsl(H,s*.85,24)};--band2:${hsl(H,s*.85,18)};--band-muted:${hsl(H,Math.min(s,35),80)};--pri:${hsl(H,s,31)};--pri-ink:#FFFFFF;${acc}`;
  const oscuro=`--band:${hsl(H,s*.6,17)};--band2:${hsl(H,s*.6,12)};--band-muted:${hsl(H,Math.min(s,28),72)};--pri:${hsl(H,Math.min(s,60),64)};--pri-ink:${hsl(H,40,10)};${acc}`;
  el.textContent=`:root{${claro}}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${oscuro}}}:root[data-theme="dark"]{${oscuro}}`;
}

  </tbody></table></div>`}`;

const cuentaAlumno=id=>S.usuarios.find(u=>u.rol==='alumno'&&u.alumnoId===id);

function formAccesoAlumno(id){

function siguienteCodigo(){
  const y=S.config.ciclo.anio;let max=0;

  return`${y}-${String(max+1).padStart(4,'0')}`;

function claveTemporal(){const a='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';let s='';crypto.getRandomValues(new Uint32Array(10)).forEach(x=>s+=a[x%a.length]);return s}
function camposCuenta(rolSel){
  return`<label class="f">Nombre completo<input name="nombre" required autocomplete="off"></label>
  <label class="f">Correo electrónico<input name="email" type="email" required autocomplete="off"></label>
  <div class="grid2"><label class="f">Contraseña temporal<input name="pass" value="${claveTemporal()}" autocomplete="off"></label>
  ${rolSel?`<label class="f">Rol<select name="rol"><option value="maestro">Maestro</option><option value="admin">Administración</option></select></label>`:''}</div>
  <p class="note">La persona podrá cambiar su contraseña al entrar, con el botón “Cambiar contraseña”.</p>`;
}
async function crearCuenta(d,colegioId,rol,colegioNombre,extra){
  const nombre=(d.nombre||'').trim(),email=(d.email||'').trim().toLowerCase(),pass=(d.pass||'').trim();
  if(!nombre||!email){toast('Escribe el nombre y el correo.',true);return false}
  if(pass.length<6){toast('La contraseña debe tener al menos 6 caracteres.',true);return false}
  const uidN=await FB.crearCuenta(email,pass);
  await escribir(FB.set(['usuarios',uidN],{nombre,email,rol,colegioId,activo:true,desde:Date.now(),...(extra||{})}));
  setTimeout(()=>mostrarCredenciales(nombre,email,pass,colegioNombre),30);
}
function mostrarCredenciales(nombre,email,pass,colegio){
  openModal({title:'Cuenta creada',body:`<p class="note">Entrega estos datos a ${h(nombre)}. Por seguridad, la contraseña no se vuelve a mostrar.</p>
  <div class="box" style="font-size:15px;line-height:1.7">Colegio: <b>${h(colegio)}</b><br>Dirección: <b>${h(location.origin)}</b><br>Correo: <b>${h(email)}</b><br>Contraseña temporal: <b>${h(pass)}</b></div>`});
}
function formUsuario(id){
  if(!id)return openModal({title:'Crear usuario',save:'Crear cuenta',body:camposCuenta(true),onSave:d=>crearCuenta(d,S.cid,d.rol==='admin'?'admin':'maestro',S.config.colegio.nombre)});
  const u=S.usuarios.find(x=>x.id===id);if(!u)return;
  openModal({title:'Editar usuario',save:'Guardar cambios',body:`<label class="f">Nombre completo<input name="nombre" value="${h(u.nombre||'')}"></label>
  <p class="note">Correo: ${h(u.email||'')}</p>
  <label class="f">Rol<select name="rol"><option value="maestro" ${u.rol==='maestro'?'selected':''}>Maestro</option><option value="admin" ${u.rol==='admin'?'selected':''}>Administración</option></select></label>
  <label class="ck"><input type="checkbox" name="activo" ${u.activo?'checked':''}> Cuenta activa (puede entrar al sistema)</label>`,
  onSave:async(d,form)=>{const cur={...u};delete cur.id;await escribir(FB.set(['usuarios',id],{...cur,nombre:(d.nombre||'').trim()||u.nombre,rol:d.rol==='admin'?'admin':'maestro',activo:form.elements.activo.checked}));toast('Usuario actualizado')}});
}

/* ================= Asistencia ================= */
const asisKey=()=>S.asisGrado&&S.asisFecha?S.asisGrado+'_'+S.asisFecha:null;
function syncAsis(){
  const k=asisKey();if(!k){S.asisDraft=null;return}
  if(S.asisDraft&&S.asisDraft.key===k&&S.asisDraft.dirty)return;
  const d=S.asis.find(x=>x.id===k);
  S.asisDraft={key:k,dirty:false,registros:{...((d&&d.registros)||{})}};
}
const ASV={P:'Presente',A:'Ausente',T:'Tarde',J:'Justificado'};
function vAsistencia(){
  subAsis();
  const gs=gradosVisibles();
  if((!S.asisGrado||!gs.find(g=>g.id===S.asisGrado))&&gs.length)S.asisGrado=gs[0].id;
  syncAsis();
  const al=S.asisGrado?alumnosDe(S.asisGrado):[];
  const d=S.asis.find(x=>x.id===asisKey());
  const r=S.asisDraft?S.asisDraft.registros:{};
  const c={P:0,A:0,T:0,J:0};let sin=0;al.forEach(a=>{r[a.id]?c[r[a.id]]++:sin++});
  return`
  <div class="vh"><div><h1>Asistencia</h1><p class="sub">${d?`Registrada por ${h(nombreDe(d.porId,d.por||''))} a las ${horaDe(d.actualizado)}${S.asisDraft&&S.asisDraft.dirty?'. Tienes cambios sin guardar.':''}`:'Aún no se ha tomado la asistencia de este día.'}</p></div>
  <div class="acts"><button class="btn ghost" data-act="asisReporte" ${S.asisGrado?'':'disabled'}>Reporte del mes</button></div></div>
  <div class="bar">
    <select id="asisGrado" aria-label="Grado">${gs.length?optsGrados(S.asisGrado,null,gs):'<option>Sin grados</option>'}</select>
    <input type="date" id="asisFecha" value="${S.asisFecha}" aria-label="Fecha">
    <button class="btn ghost" data-act="asisTodos" ${al.length?'':'disabled'}>Marcar todos presentes</button>
  </div>
  ${!gs.length?empty('No hay grados creados todavía. La administración debe crearlos en Inscripciones.'):
   !al.length?empty('Este grado no tiene alumnos inscritos.'):
  `<div class="panel">${al.map(a=>`<div class="asis-row"><div><b>${h(a.apellidos)}</b>, ${h(a.nombres)}</div>
    <div class="seg" role="group" aria-label="Asistencia de ${h(nomAlN(a))}">${['P','A','T','J'].map(v=>`<button class="v-${v} ${r[a.id]===v?'on':''}" data-act="asisMarca" data-id="${a.id}" data-v="${v}" aria-pressed="${r[a.id]===v}"><span class="full">${ASV[v]}</span><span class="short">${v}</span></button>`).join('')}</div></div>`).join('')}</div>
  <div class="sticky-foot"><div class="cnt"><span><b>${c.P}</b> presentes</span><span><b>${c.A}</b> ausentes</span><span><b>${c.T}</b> tarde</span><span><b>${c.J}</b> justificados</span>${sin?`<span class="muted">${sin} sin marcar</span>`:''}</div>
  <button class="btn" data-act="asisGuardar" ${S.asisDraft&&S.asisDraft.dirty?'':'disabled'}>Guardar asistencia</button></div>`}`;
}
async function reporteAsis(){
  const g=S.asisGrado;const[y,m]=S.asisFecha.split('-').map(Number);
  let docs;
  try{docs=(await Store.query('asistencia',[['fecha','>=',`${y}-${pad(m)}-01`],['fecha','<=',`${y}-${pad(m)}-31`]])).filter(d=>d.gradoId===g)}catch(e){return toast(msgErr(e),true)}
  docs.sort((a,b)=>a.fecha<b.fecha?-1:1);
  const al=alumnosDe(g);
  const titulo=`Reporte de asistencia, ${MESES[m-1]} ${y}`;
  const html=`<div class="hoja">${encabezado()}<div class="tit"><div class="t1">${titulo}</div><div class="t2">${h(gradoTxt(g))}</div></div>
  ${docs.length?`<table class="t rep"><thead><tr><th>Alumno</th>${docs.map(d=>`<th class="c">${+d.fecha.slice(8)}</th>`).join('')}<th class="c">P</th><th class="c">A</th><th class="c">T</th><th class="c">J</th><th class="c">%</th></tr></thead><tbody>
  ${al.map(a=>{const c={P:0,A:0,T:0,J:0};const cells=docs.map(d=>{const v=(d.registros||{})[a.id]||'';if(v)c[v]++;return`<td class="c">${v}</td>`}).join('');const tot=c.P+c.A+c.T+c.J;return`<tr><td>${h(nomAl(a))}</td>${cells}<td class="c">${c.P}</td><td class="c">${c.A}</td><td class="c">${c.T}</td><td class="c">${c.J}</td><td class="c">${tot?Math.round((c.P+c.T+c.J)*100/tot):'-'}</td></tr>`}).join('')}
  </tbody></table><p class="small">P: presente. A: ausente. T: llegó tarde. J: ausencia justificada. El porcentaje cuenta presentes, tardes y justificados.</p>`:'<p>No hay asistencia registrada en este mes.</p>'}</div>`;
  vistaImpresion(titulo+' '+gradoTxt(g),html);
}

/* ================= Tareas ================= */
function vTareas(){
  needTareas();needEntregas();
  const g=S.f.tGrado||'',hoy=hoyISO(),q=(S.f.tBuscar||'').toLowerCase();
  const mias=!esAdmin()&&S.f.soloMias;const mc=misCursosIds();
  let list=S.tareas.filter(t=>(!g||t.gradoId===g)&&(!mias||t.autorId===S.me.id||mc.includes(t.cursoId))&&(!q||[t.titulo,cursoNom(t),nombreDe(t.autorId,t.maestro)].join(' ').toLowerCase().includes(q)));
  const prox=list.filter(t=>(t.fechaEntrega||'')>=hoy).sort((a,b)=>a.fechaEntrega<b.fechaEntrega?-1:1);
  const pas=list.filter(t=>(t.fechaEntrega||'')<hoy).sort((a,b)=>a.fechaEntrega>b.fechaEntrega?-1:1);
  const fila=t=>{
    const al=alumnosDe(t.gradoId),ent=t.entregas||{};
    const enLinea=S.entregas.filter(x=>x.tareaId===t.id&&x.enviada);
    const n=al.filter(a=>(ent[a.id]&&ent[a.id].e)||enLinea.some(x=>x.alumnoId===a.id)).length;
    const nuevas=enLinea.filter(x=>x.enviada>(t.calificada||0)).length;
    const notas=al.map(a=>ent[a.id]&&ent[a.id].n).filter(esNum).map(Number);
    const prom=notas.length?(notas.reduce((s,x)=>s+x,0)/notas.length).toFixed(1):'';
    const nueva=Date.now()-(t.creada||0)<86400000;
    const dias=Math.round((new Date(t.fechaEntrega+'T00:00')-new Date(hoy+'T00:00'))/86400000);
    const puede=puedeEditar(t);
    return`<tr><td><b>${h(t.titulo)}</b> ${nueva?'<span class="tag info">Nueva</span>':''}<div class="muted" style="font-size:13px">${h(cursoNom(t))}${t.unidad?`, unidad ${ROM[t.unidad-1]}`:''}, ${h(nombreDe(t.autorId,t.maestro||''))}</div></td>
    <td class="nowrap">${h(gradoTxt(t.gradoId))}</td>
    <td class="nowrap">${fechaCorta(t.fechaEntrega)}<div style="font-size:13px" class="muted">${dias<0?'Cerrada':dias===0?'Vence hoy':dias===1?'Vence mañana':'En '+dias+' días'}</div></td>
    <td class="nowrap">${n} de ${al.length}${nuevas?` <span class="tag info" title="Entregas en línea sin revisar">${nuevas} sin revisar</span>`:''}<div class="prog" title="${n} de ${al.length} entregadas"><i style="width:${al.length?n*100/al.length:0}%"></i></div></td>
    <td class="r nowrap">${prom?prom+' / '+(t.punteo||''):'<span class="muted">Sin notas</span>'}</td>
    <td class="r nowrap">${puede?`<button class="btn sm" data-act="tareaCalificar" data-id="${t.id}">Entregas y notas</button> <button class="btn ghost sm" data-act="tareaEditar" data-id="${t.id}">Editar</button>`:`<button class="btn ghost sm" data-act="tareaCalificar" data-id="${t.id}">Ver</button>`}</td></tr>`;
  };
  const tabla=(arr,tit)=>arr.length?`<h2 style="margin:18px 0 10px">${tit}</h2><div class="tw"><table class="tbl"><thead><tr><th>Tarea</th><th>Grado</th><th>Entrega</th><th>Entregadas</th><th class="r">Promedio</th><th></th></tr></thead><tbody>${arr.map(fila).join('')}</tbody></table></div>`:'';
  return`
  <div class="vh"><div><h1>Tareas</h1><p class="sub">${esAdmin()?'Las tareas que publican los maestros aparecen aquí al momento.':'Publica tareas y registra entregas y notas. Cuentan para la nota de la unidad.'}</p></div>
  <div class="acts"><button class="btn" data-act="tareaNueva">Publicar tarea</button></div></div>
  <div class="bar">
    <input type="search" id="tBuscar" data-filter="tBuscar" placeholder="Buscar por título, curso o maestro" value="${h(S.f.tBuscar||'')}" aria-label="Buscar tarea">
    <select data-filter="tGrado" aria-label="Grado">${optsGrados(g,'Todos los grados')}</select>
    ${!esAdmin()?`<label class="ck"><input type="checkbox" data-filter="soloMias" ${S.f.soloMias?'checked':''}> Solo mis cursos</label>`:''}
  </div>
  ${!list.length?empty(S.tareas.length?'No hay tareas con estos filtros.':'Todavía no se han publicado tareas.',S.cursos.length?'Publicar tarea':'',S.cursos.length?'tareaNueva':''):tabla(prox,'Por entregar')+tabla(pas,'Cerradas')}`;
}

    await Store.set('tareas',nid,data);
    try{await publicarCopia(nid,data)}catch(e){console.error(e);toast('La tarea se guardó, pero no se pudo publicar para los alumnos. Revisa las reglas de Firebase.',true);return}
    toast(id?'Tarea actualizada':'Tarea publicada');
  }});

/* ======== Material de apoyo del maestro (enlace, y archivo si la nube está activa) ======== */
function camposMaterial(m){
  m=m||{};const conArch=archivosOn();
  return`<h3 style="font-size:15px;margin-top:6px">Material de apoyo (opcional)</h3>
  <label class="f">Enlace (Google Drive, YouTube, página web)<input name="matEnlace" type="url" value="${h(m.enlace||'')}" placeholder="https://drive.google.com/…"></label>
  ${conArch?`<div>${m.archivo&&m.archivo.url?`<div class="adj" style="margin-bottom:8px"><span><a href="${h(m.archivo.url)}" target="_blank" rel="noopener">${h(m.archivo.nombre)}</a> <small class="muted">${tamTxt(m.archivo.tam)}</small></span><label class="ck"><input type="checkbox" name="quitarMat"> Quitar</label></div>`:''}
    <p class="note" style="margin-bottom:6px">Archivo: PDF, Word, Excel, PowerPoint o imagen, hasta 10 MB.${m.archivo&&m.archivo.url?' Si eliges otro, reemplaza al actual.':''}</p>
    <input type="file" name="matArchivo" accept="${TIPOS_ARCHIVO}" aria-label="Archivo de material"></div>
    <div class="upbar" id="matBar" hidden><i></i></div>`:`<p class="note">${portalOn()?'Los alumnos verán este enlace al abrir la tarea.':'Queda guardado con la tarea.'}</p>`}`;
}
/* Devuelve {enlace,archivo} o null; false si hay un error que impide guardar */
async function leerMaterial(form,prev,carpeta){
  prev=prev||{};const E=form.elements;
  const enlace=String((E.matEnlace&&E.matEnlace.value)||'').trim();
  if(enlace&&!enlaceOk(enlace)){toast('El enlace del material no es válido. Cópialo completo, empezando con https://',true);return false}
  let archivo=prev.archivo||null;
  let file=archivosOn()&&E.matArchivo&&E.matArchivo.files[0];
  if(E.quitarMat&&E.quitarMat.checked&&!file)archivo=null;
  if(file){
    file=await comprimirImagen(file);
    if(file.size>MAX_ARCHIVO){toast(`El archivo pesa ${tamTxt(file.size)}. El máximo es 10 MB.`,true);return false}
    const bar=$('#matBar');if(bar)bar.hidden=false;
    const limpio=slug(file.name.replace(/\.[^.]+$/,'')).slice(0,60)+(file.name.match(/\.[a-z0-9]+$/i)||[''])[0].toLowerCase();
    const ruta=`${carpeta}/${Date.now()}_${limpio}`;
    try{const url=await FB.subir(ruta,file,p=>{const i=bar&&bar.querySelector('i');if(i)i.style.width=Math.round(p*100)+'%'});archivo={nombre:file.name,url,ruta,tipo:file.type||'',tam:file.size}}
    catch(err){console.error(err);if(bar)bar.hidden=true;toast('No se pudo subir el archivo. Revisa tu internet e intenta de nuevo.',true);return false}
  }
  if(prev.archivo&&prev.archivo.ruta&&(!archivo||archivo.ruta!==prev.archivo.ruta))FB.borrarArchivo(prev.archivo.ruta);
  return enlace||archivo?{enlace,archivo}:null;
}
function htmlMaterial(m,titulo){
  if(!m||(!m.enlace&&!(m.archivo&&m.archivo.url)))return'';
  return`<div style="display:grid;gap:6px"><b style="font-size:14px">${titulo||'Material de apoyo'}</b>
  ${m.enlace?`<div class="adj"><span class="muted" style="overflow-wrap:anywhere">${h(m.enlace.length>60?m.enlace.slice(0,57)+'…':m.enlace)}</span><a href="${h(m.enlace)}" target="_blank" rel="noopener">Abrir enlace</a></div>`:''}
  ${m.archivo&&m.archivo.url?`<div class="adj"><span>${h(m.archivo.nombre)} <small class="muted">${tamTxt(m.archivo.tam)}</small></span><a href="${h(m.archivo.url)}" target="_blank" rel="noopener">Abrir archivo</a></div>`:''}</div>`;
}
/* Lo que el alumno entregó en línea, para mostrarlo al maestro */
function detalleEntrega(x){
  if(!x||!x.enviada)return'<span class="muted">–</span>';
  const partes=[];
  if(x.texto)partes.push(`<div>${hb(x.texto)}</div>`);
  if(x.enlace)partes.push(`<div><a href="${h(x.enlace)}" target="_blank" rel="noopener">Abrir enlace</a></div>`);
  if(x.archivo&&x.archivo.url)partes.push(`<div><a href="${h(x.archivo.url)}" target="_blank" rel="noopener">${h(x.archivo.nombre||'Ver archivo')}</a> <small class="muted">${tamTxt(x.archivo.tam)}</small></div>`);
  return`<details class="ent-det"><summary>${x.tarde?'Entregó tarde':'Entregó'}</summary><div class="muted">${fechaCorta(isoDe(new Date(x.enviada)))} a las ${horaDe(x.enviada)}</div>${partes.join('')}</details>`;
}
const tamTxt=b=>!b?'':b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1)+' MB';
const enlaceOk=u=>/^https?:\/\/[^\s]+\.[^\s]+/i.test(String(u||'').trim());
function formEntregas(id){
  const t=S.tareas.find(x=>x.id===id);if(!t)return;
  const al=alumnosDe(t.gradoId),ent=t.entregas||{};const puede=puedeEditar(t);const pl=portalOn();
  if(pl)needEntregas();
  const enLinea=a=>{const x=entregaDe(id,a.id);return x&&x.enviada?x:null};
  const nLinea=al.filter(enLinea).length;
  openModal({kind:'entregas',title:t.titulo,save:puede?'Guardar entregas y notas':null,body:`
  <p class="note">${h(cursoNom(t))} en ${h(gradoTxt(t.gradoId))}${t.unidad?`, unidad ${ROM[t.unidad-1]}`:''}. Entrega: ${fechaLarga(t.fechaEntrega)}. Valor: ${h(t.punteo||'sin punteo')} puntos.</p>
  ${t.descripcion?`<div class="box">${hb(t.descripcion)}</div>`:''}
  ${htmlMaterial(t.material)}
  ${pl?`<p class="note" id="entResumen">${nLinea} de ${al.length} alumnos entregaron en línea. La lista se actualiza sola. Las notas que guardes aquí las ve cada alumno en su portal.</p>`:''}
  ${al.length?`${puede?`<div class="bar" style="margin:0"><button type="button" class="btn ghost sm" data-act="entTodos">Marcar todos como entregado</button></div>`:''}
  <table class="tbl"><thead><tr><th>Alumno</th>${pl?'<th>En línea</th>':''}<th>Entregó</th><th class="r">Nota</th></tr></thead><tbody>
  ${al.map(a=>{const e=ent[a.id]||{};const x=enLinea(a);return`<tr><td>${h(nomAl(a))}</td>${pl?`<td data-enl="${a.id}">${detalleEntrega(x)}</td>`:''}<td><input type="checkbox" name="e_${a.id}" ${e.e||x?'checked':''} ${puede?'':'disabled'} aria-label="Entregó ${h(nomAlN(a))}"></td><td class="r"><input type="number" name="n_${a.id}" value="${h(e.n??'')}" min="0" ${t.punteo?`max="${t.punteo}"`:''} step="0.5" style="width:90px" ${puede?'':'disabled'} aria-label="Nota de ${h(nomAlN(a))}"></td></tr>`}).join('')}
  </tbody></table>`:'<p class="note">Este grado no tiene alumnos inscritos.</p>'}`,
  onSave:puede?async(d,form)=>{
    const entregas={};const max=Number(t.punteo)||Infinity;let excede=false;

const miEntrega=tid=>S.misEntregas.find(x=>x.tareaId===tid);
function estadoTarea(t){
  const x=miEntrega(t.id),hoy=hoyISO();
  if(x&&x.calif&&esNum(x.calif.n))return{k:'cal',tag:'info',txt:`Nota: ${fmt(x.calif.n)} de ${t.punteo||'–'}`,x};
  if(x&&x.enviada)return{k:'ok',tag:x.tarde?'warn':'ok',txt:x.tarde?'Entregada tarde':'Entregada',x};
  if(!t.fechaEntrega)return{k:'pend',tag:'warn',txt:'Pendiente',x};
  const dias=Math.round((new Date(t.fechaEntrega+'T00:00')-new Date(hoy+'T00:00'))/86400000);
  if(dias<0)return{k:'bad',tag:'bad',txt:'No entregada',x};
  return{k:'pend',tag:'warn',txt:dias===0?'Vence hoy':dias===1?'Vence mañana':`Vence en ${dias} días`,x};
}

function comprimirImagen(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size<700*1024)return Promise.resolve(file);
  return new Promise(res=>{
    const u=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>{const max=1800,s=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
      const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);
      cv.toBlob(b=>{if(!b||b.size>=file.size)return res(file);res(new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}))},'image/jpeg',.8)};
    im.onerror=()=>{URL.revokeObjectURL(u);res(file)};im.src=u;
  });
}

  <p class="note">${h(gradoTxt(a.gradoId))}. Cuota mensual: ${money(cuotaDe(a))}. Marca todos los meses que cubre este pago; se emite un solo recibo.</p>
  <div>${pendientes.map(x=>{const e=estadoMes(a,x);return`<label class="mrow"><input type="checkbox" name="m_${x}" ${x===m?'checked':''}><span>${MESES[x-1]} ${e==='atrasado'?'<span class="tag bad">Atrasado</span>':e==='pendiente'?'<span class="tag warn">Este mes</span>':''}</span><span class="muted">${money(cuotaDe(a))}${e==='atrasado'?` + ${money(moraCfg)} mora`:''}</span></label>`}).join('')}</div>
  <label class="ck"><input type="checkbox" name="cobrarMora" checked> Cobrar mora en los meses atrasados</label>
  <div class="grid2">
    <label class="f">Fecha de pago<input type="date" name="fecha" value="${hoyISO()}"></label>
    <label class="f">Número de recibo<input name="recibo" value="${sigRecibo()}" autocomplete="off"></label>
    <label class="f span2">Forma de pago<select name="forma"><option>Efectivo</option><option>Depósito bancario</option><option>Transferencia</option><option>Tarjeta</option><option>Cheque</option></select></label>
  </div>`,
  onSave:async(d,form)=>{
    const sel=pendientes.filter(x=>form.elements['m_'+x].checked);if(!sel.length){toast('Marca al menos un mes.',true);return false}
    const rec=String(d.recibo||'').trim();if(!rec){toast('Escribe el número de recibo.',true);return false}
    const usado=Object.values(S.pagos).some(pg=>Object.values(pg.meses||{}).some(x=>x.recibo===rec)&&pg.id!==id)||Object.values((S.pagos[id]||{}).meses||{}).some(x=>x.recibo===rec);
    if(usado&&!await confirmar(`El recibo No. ${rec} ya existe. ¿Usarlo de todas formas?`,'Usar este número'))return false;
    const cur=clone(S.pagos[id]||{meses:{}});delete cur.id;cur.meses=cur.meses||{};
    const cobrar=form.elements.cobrarMora.checked;
    sel.forEach(x=>{const mo=cobrar&&estadoMes(a,x)==='atrasado'?moraCfg:0;cur.meses[x]={monto:cuotaDe(a)+mo,mora:mo,fecha:d.fecha,recibo:rec,forma:d.forma,porId:S.me.id,registrado:Date.now()}});
    cur.alumnoId=id;await Store.set('pagos',id,cur);S.pagos[id]={...cur,id};
    toast(sel.length===1?`Pago de ${MESES[sel[0]-1].toLowerCase()} registrado`:`${sel.length} meses registrados`);
    setTimeout(()=>vistaImpresion(`Recibo ${rec} ${nomAlN(a)}`,htmlRecibo(a,rec)),30);
  }});
}

function prevCfg(){const real=S.config;S.config=mergeCfg(S.cfgDraft);const al=activos().find(a=>deuda(a).meses.length);const out=encabezado()+(al?htmlAviso(al).replace(/^<div class="hoja">.*?<div class="ref">/s,'<div class="hoja"><div class="ref">'):'<p style="color:#777">Cuando un alumno tenga pagos atrasados, aquí verás un ejemplo del aviso.</p>');S.config=real;return out}
function resizeLogo(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=240,s=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/png'))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ================= Diálogos ================= */
const dlg=$('#dlg'),dlgForm=$('#dlgForm');
function openModal(o){
  S.modal=o;$('#dlgT').textContent=o.title;$('#dlgB').innerHTML=o.body;
  $('#dlgF').innerHTML=(o.foot||'')+`<button type="button" class="btn ghost" data-act="cerrar">${o.onSave?'Cancelar':'Cerrar'}</button>`+(o.onSave?`<button type="submit" class="btn">${h(o.save||'Guardar')}</button>`:'');
  dlg.classList.toggle('wide',!!o.wide);
  if(!dlg.open)dlg.showModal();
  const f=dlg.querySelector('.dlg-b input:not([type=checkbox]):not([type=radio]):not([type=hidden]):not([disabled])');if(f&&o.onSave)setTimeout(()=>f.focus(),30);
}
function closeModal(){S.modal=null;if(dlg.open)dlg.close()}
dlg.addEventListener('close',()=>{S.modal=null});
dlgForm.addEventListener('submit',async e=>{
  e.preventDefault();const o=S.modal;if(!o||!o.onSave)return;
  const btn=dlgForm.querySelector('footer button[type=submit]');if(btn)btn.disabled=true;
  try{const r=await o.onSave(Object.fromEntries(new FormData(dlgForm)),dlgForm);if(r!==false&&S.modal===o)closeModal()}
  catch(err){toast(msgErr(err),true)}
  finally{if(btn)btn.disabled=false}
});
function confirmar(msg,si='Sí, continuar'){return new Promise(res=>{const c=$('#cfm');$('#cfmM').textContent=msg;$('#cfmSi').textContent=si;const fin=v=>{c.close();res(v)};$('#cfmForm').onsubmit=e=>{e.preventDefault();fin(true)};$('#cfmNo').onclick=()=>fin(false);c.oncancel=e=>{e.preventDefault();fin(false)};c.showModal()})}

  colorQuitar:()=>{S.cfgDraft.colegio.color='';S.cfgDraft.colegio.color2='';S.cfgDraft._dirty=true;aplicarTema('');render()},
  examNuevo:()=>{if(sinCursos())return;S.examDraft={...examNuevo(),_nuevo:true};S.view='examEditor';render();scrollTo(0,0)},
  examEditar:d=>{const e=S.examenes.find(x=>x.id===d.id);if(!e)return;S.examDraft={...examNuevo(),...clone(e)};S.examDraft.campos={...examNuevo().campos,...(e.campos||{})};S.view='examEditor';render();scrollTo(0,0)},
  examDuplicar:d=>{const e=S.examenes.find(x=>x.id===d.id);if(!e)return;const c=clone(e);c.id=uid();c.titulo=e.titulo+' (copia)';c._nuevo=true;c.notas={};delete c.creada;delete c.actualizado;delete c.autorId;c.campos={...examNuevo().campos,...(c.campos||{})};S.examDraft={...examNuevo(),...c};S.view='examEditor';render();scrollTo(0,0)},
  examVolver:()=>ACT.ir({v:'examenes'}),
  examGuardar:async()=>{const d=S.examDraft;if(!d)return;if(!d.cursoId)return toast('Elige el curso del examen para que cuente en las notas.',true);const data=clone(d);delete data._nuevo;delete data._dirty;const ex=S.examenes.find(x=>x.id===d.id);data.creada=ex&&ex.creada||Date.now();data.autorId=ex&&ex.autorId||S.me.id;data.notas=ex&&ex.notas||data.notas||{};data.actualizado=Date.now();data.anio=data.anio||+S.config.ciclo.anio;
    try{await Store.set('examenes',d.id,data);d._nuevo=false;d._dirty=false;toast('Examen guardado');render()}catch(e){toast(msgErr(e),true)}},
  examBorrar:async()=>{const d=S.examDraft;if(!d||!await confirmar(`¿Eliminar el examen “${d.titulo}” y sus notas?`,'Eliminar'))return;try{await Store.del('examenes',d.id);S.examDraft=null;S.view='examenes';render();toast('Examen eliminado')}catch(e){toast(msgErr(e),true)}},
  examVerPrev:()=>{const d=S.examDraft;vistaImpresion(d.titulo||'Examen',htmlExamen(d,false))},
  examImprimir:d=>{const e=S.examenes.find(x=>x.id===d.id);if(e)vistaImpresion(e.titulo,htmlExamen(e,false))},
  examClave:d=>{const e=S.examenes.find(x=>x.id===d.id);if(e)vistaImpresion(e.titulo+' (clave)',htmlExamen(e,true))},
  examNotas:d=>formNotasExamen(d.id),
  serieAdd:d=>{S.examDraft.series.push(serieNueva(d.t));S.examDraft._dirty=true;render()},
  serieBorrar:async d=>{if(!await confirmar('¿Eliminar esta serie y sus preguntas?','Eliminar'))return;S.examDraft.series.splice(+d.i,1);S.examDraft._dirty=true;render()},
  serieMover:d=>{const a=S.examDraft.series,i=+d.i,j=i+Number(d.d);if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];S.examDraft._dirty=true;render()},
  pregAdd:d=>{const s=S.examDraft.series[+d.i];const last=s.preguntas[s.preguntas.length-1];const p=pregNueva(s.tipo);if(last)p.puntos=last.puntos;s.preguntas.push(p);S.examDraft._dirty=true;render();const ta=document.querySelector(`[data-bind="series.${d.i}.preguntas.${s.preguntas.length-1}.texto"]`);if(ta)ta.focus()},
  pregDel:d=>{S.examDraft.series[+d.i].preguntas.splice(+d.j,1);S.examDraft._dirty=true;render()},
  opAdd:d=>{S.examDraft.series[+d.i].preguntas[+d.j].opciones.push('');S.examDraft._dirty=true;render()},
  opDel:d=>{const p=S.examDraft.series[+d.i].preguntas[+d.j];const k=+d.k;p.opciones.splice(k,1);if(+p.correcta===k)p.correcta=0;else if(+p.correcta>k)p.correcta--;S.examDraft._dirty=true;render()},
  actNotas:d=>{if(d.t==='examen'){const e=S.examenes.find(x=>x.id===d.id);if(e&&puedeEditar(e))formNotasExamen(d.id);else toast('Solo el maestro del curso puede registrar estas notas.',true)}else formEntregas(d.id)},
  cuadroImprimir:()=>{const u=+S.f.nUnidad;const c=cursoDe(S.f.nCurso)||{};vistaImpresion(`Cuadro de notas ${c.nombre||''} ${gradoTxt(S.f.nGrado)}${u?' unidad '+ROM[u-1]:''}`,htmlCuadro())},
  boletasGrado:()=>boletas(alumnosDe(S.f.nGrado).map(a=>a.id)),

  reciboVer:d=>{const a=S.alumnos.find(x=>x.id===d.id);if(a)vistaImpresion(`Recibo ${d.r} ${nomAlN(a)}`,htmlRecibo(a,d.r))},
  estadoCuenta:d=>{const a=S.alumnos.find(x=>x.id===d.id);if(a)vistaImpresion('Estado de cuenta '+nomAlN(a),htmlEstadoCuenta(a))},

    onSave:d=>{if(!d.desde||!d.hasta||d.desde>d.hasta){toast('Revisa las fechas.',true);return false}vistaImpresion(`Reporte de cobros ${fechaCorta(d.desde)} a ${fechaCorta(d.hasta)}`,htmlCobros(d.desde,d.hasta))}})},
  selAtrasados:()=>{activos().filter(a=>(!S.f.pGrado||a.gradoId===S.f.pGrado)&&deuda(a).meses.length).forEach(a=>S.sel.add(a.id));render()},

  avisoUno:d=>{const a=S.alumnos.find(x=>x.id===d.id);if(a)vistaImpresion('Aviso de pago '+nomAlN(a),htmlAviso(a))},

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b)}});

function bindExam(t){
  let v;
  if(t.type==='checkbox')v=t.checked;
  else if(t.type==='radio'){if(!t.checked)return;v=Number(t.value)}
  else v=t.hasAttribute('data-num')?(t.value===''?'':Number(t.value)):t.value;
  setPath(S.examDraft,t.dataset.bind,v);S.examDraft._dirty=true;
  if(t.dataset.bind==='gradoId'){const cs=cursosVisibles(v);if(!cs.find(c=>c.id===S.examDraft.cursoId))S.examDraft.cursoId=(cs[0]||{}).id||'';render();return}
  refrescarPrev();
}
let cfgT;
function bindCfg(t){
  const v=t.hasAttribute('data-num')?Number(t.value):t.value;setPath(S.cfgDraft,t.dataset.cfg,v);S.cfgDraft._dirty=true;
  if(t.dataset.cfg==='colegio.color'){aplicarTema(v,S.cfgDraft.colegio.color2);const m=$('#colorMuestra');if(m)m.textContent=v.toUpperCase()}
  clearTimeout(cfgT);cfgT=setTimeout(()=>{const p=$('#cfgPrev');if(p)p.innerHTML=prevCfg()},200);
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bind&&S.examDraft&&t.type!=='radio'&&t.type!=='checkbox'&&t.tagName!=='SELECT')return bindExam(t);
  if(t.dataset.cfg&&S.cfgDraft&&t.tagName!=='SELECT')return bindCfg(t);
  if(t.dataset.filter&&t.type==='search'){S.f[t.dataset.filter]=t.value;renderKeep(t.id)}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.bind&&S.examDraft&&(t.type==='radio'||t.type==='checkbox'||t.tagName==='SELECT'))return bindExam(t);
  if(t.dataset.cfg&&S.cfgDraft&&t.tagName==='SELECT')return bindCfg(t);
  if(t.dataset.filter&&t.type!=='search'){S.f[t.dataset.filter]=t.type==='checkbox'?t.checked:t.value;render();return}
  if(t.dataset.sel){t.checked?S.sel.add(t.dataset.sel):S.sel.delete(t.dataset.sel);render();return}
  if(t.dataset.dep==='cursoId'){const s=dlg.querySelector('[name=cursoId]');if(s)s.innerHTML=optsCursos(t.value);return}
  if(t.id==='cGrado'){S.cGrado=t.value;$('#dlgB').innerHTML=bodyCursos();return}
  if(t.dataset.cm){const c=cursoDe(t.dataset.cm);if(!c)return;try{await Store.set('cursos',c.id,{...c,maestroId:t.value});toast('Maestro asignado')}catch(err){toast(msgErr(err),true)}return}
  if(t.id==='asisGrado'){if(S.asisDraft&&S.asisDraft.dirty&&!await confirmar('Hay asistencia sin guardar. ¿Cambiar de grado sin guardar?','Cambiar sin guardar')){t.value=S.asisGrado;return}S.asisGrado=t.value;S.asisDraft=null;render();return}
  if(t.id==='asisFecha'){if(!t.value)return;if(S.asisDraft&&S.asisDraft.dirty&&!await confirmar('Hay asistencia sin guardar. ¿Cambiar de fecha sin guardar?','Cambiar sin guardar')){t.value=S.asisFecha;return}S.asisFecha=t.value;S.asisDraft=null;subAsis();render();return}
  if(t.id==='restFile'&&t.files[0]){try{previaRestaurar(JSON.parse(await t.files[0].text()))}catch(err){previaRestaurar(null)}return}
  if(t.id==='logoFile'&&t.files[0]){try{S.cfgDraft.colegio.logo=await resizeLogo(t.files[0]);S.cfgDraft._dirty=true;
    const r=await coloresDeLogo(S.cfgDraft.colegio.logo);
    if(r){Object.assign(S.cfgDraft.colegio,r);aplicarTema(r.color,r.color2);toast('Se tomaron los colores del logo. Guarda la configuración para que todos los vean.')}
    else toast('Logo cargado. No tiene un color definido; puedes elegir el color a mano.');
    render()}catch(err){toast('No se pudo leer la imagen. Prueba con PNG o JPG.',true)}return}
  if(t.name&&/^e_/.test(t.name)&&dlg.contains(t)){t.dataset.tocado=1;return}
  if(t.hasAttribute('data-todos-grados')){dlg.querySelectorAll('input[name^="g_"]').forEach(c=>c.checked=t.checked);return}
});

/* ================= Sesión e inicio ================= */
function bloquear(msg){stopAll();S.cid=null;S.bloqueoMsg=msg;S.view='bloqueo';renderWho();pintarMarca();render()}
function abrirColegio(cid,col){
  stopAll();resetDatos();S.cid=cid;S.colegio=col;S.view=vistaInicial();
  needQ('config','x',()=>FB.sub(['colegios',cid,'config','general'],[],d=>{S.config=mergeCfg(d[0]);if(S.cfgDraft&&!S.cfgDraft._dirty)S.cfgDraft=null;pintarMarca();scheduleRender()},errSub));
  needQ('grados','x',()=>Store.sub('grados',d=>{S.grados=d.sort((a,b)=>(a.orden||0)-(b.orden||0));if(S.modal&&S.modal.kind==='grados'){const n=$('#gNom')?.value||'';$('#dlgB').innerHTML=bodyGrados();$('#gNom').value=n}scheduleRender()}));
  if(!esAlumno()){
    needQ('cursos','x',()=>Store.sub('cursos',d=>{S.cursos=d;if(S.tareas.length)setTimeout(sincronizarCopias,1500);if(S.modal&&S.modal.kind==='cursos'){const n=$('#cNom')?.value||'';$('#dlgB').innerHTML=bodyCursos();const i=$('#cNom');if(i)i.value=n}scheduleRender()}));
    needQ('usuarios','x',()=>FB.sub(['usuarios'],[['colegioId','==',cid]],d=>{S.usuarios=d;scheduleRender()},errSub));
    needQ('asisHoy',hoyISO(),()=>Store.sub('asistencia',d=>{S.asisHoy=d;scheduleRender()},[['fecha','==',hoyISO()]]));
  }
  if(S.me.rol!=='super'){
    needQ('yoColegio','x',()=>FB.sub(['colegios',cid],[],d=>{const c=d[0];if(c&&c.activo!==true)return bloquear('El servicio para tu colegio está suspendido temporalmente. Comunícate con la administración de tu colegio.');
      if(c&&esAlumno()&&c.portalAlumnos!==true)return bloquear('El portal de alumnos no está disponible en tu colegio en este momento.');
      if(c){const antes=portalOn();S.colegio=c;if(antes!==portalOn())scheduleRender()}},()=>{}));
    needQ('yoPerfil','x',()=>FB.sub(['usuarios',S.me.id],[],d=>{const p=d[0];if(!p||p.activo!==true)return bloquear('Tu cuenta fue desactivada. Contacta a la administración de tu colegio.');const rol=rolDe(p);if(rol!==S.me.rol||p.nombre!==S.me.nombre){S.me.rol=rol;S.me.nombre=p.nombre||S.me.email;renderWho();render()}},()=>{}));
  }
  renderWho();pintarMarca();render();scrollTo(0,0);
}
function verColegios(){
  stopAll();resetDatos();S.cid=null;S.colegio=null;S.view='super';
  needQ('colegios','x',()=>FB.sub(['colegios'],[],d=>{S.colegios=d;if(!S.resumenCargando&&(!S.resumen||d.some(c=>!S.resumen.por[c.id])))cargarResumen();scheduleRender()},errSub));
  renderWho();pintarMarca();render();
}
function iniciar(){
  FB.onUser(async u=>{
    stopAll();resetDatos();S.cid=null;S.colegio=null;S.resumen=null;closeModal();
    if(!u){S.me={id:null,rol:'anon',nombre:'',email:''};S.view='login';renderWho();pintarMarca();render();return}
    S.me={id:u.uid,email:u.email||'',nombre:'',rol:'cargando'};renderWho();render();
    if(u.uid===FB.superUid){S.me.rol='super';S.me.nombre=u.email||'Superadministrador';return verColegios()}
    let p=null;try{p=await FB.get(['usuarios',u.uid])}catch(e){p=null}
    if(!p)return bloquear('Tu cuenta no está asignada a ningún colegio. Contacta a la administración de tu colegio.');
    if(p.activo!==true)return bloquear('Tu cuenta está desactivada. Contacta a la administración de tu colegio.');
    let col=null;try{col=await FB.get(['colegios',p.colegioId])}catch(e){col=null}
    if(!col||col.activo!==true)return bloquear('El servicio para tu colegio está suspendido temporalmente. Comunícate con la administración de tu colegio.');
    if(p.rol==='alumno'&&(col.portalAlumnos!==true||!p.alumnoId))return bloquear('El portal de alumnos no está disponible en tu colegio en este momento.');
    S.me={id:u.uid,email:u.email||'',nombre:p.nombre||u.email,rol:rolDe(p),alumnoId:p.alumnoId||null};
    if(!p.ultimoAcceso||Date.now()-p.ultimoAcceso>30*60000)FB.update(['usuarios',u.uid],{ultimoAcceso:Date.now()}).catch(()=>{});
    abrirColegio(p.colegioId,col);
  });
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='loginForm')return;e.preventDefault();
  const f=e.target,btn=f.querySelector('button[type=submit]');const email=f.elements.email.value.trim(),pass=f.elements.pass.value;
  if(!email||!pass)return toast('Escribe tu correo y tu contraseña.',true);
  btn.disabled=true;btn.textContent='Entrando…';
  try{await FB.login(email,pass)}catch(err){toast(msgErr(err),true);btn.disabled=false;btn.textContent='Entrar'}
});
setInterval(()=>{if(S.view==='panel')scheduleRender()},60000);
function arrancar(){if(S.iniciado)return;S.iniciado=true;iniciar()}
if(window.FB)arrancar();
else{window.addEventListener('fb-listo',arrancar);setTimeout(()=>{if(!window.FB)$('#view').innerHTML='<div class="lock panel pad"><h1>No se pudo conectar</h1><p class="sub" style="margin-top:10px">No se cargó Firebase. Revisa tu conexión a internet. Si estás probando en tu computadora, abre la página con un servidor local (no con doble clic sobre el archivo).</p></div>'},12000)}
