<script type="module">
import { firebaseConfig, SUPER_UID } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, initializeAuth, inMemoryPersistence, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, query, where, onSnapshot, setDoc, deleteDoc, getDocs, getDoc, getCountFromServer, writeBatch, updateDoc } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
auth.languageCode = 'es';
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { db = initializeFirestore(app, {}); }

// Segunda instancia solo para crear cuentas sin cerrar la sesión de quien las crea
let authSec = null;
function secundaria() {
  if (!authSec) { const s = initializeApp(firebaseConfig, 'crear-cuentas'); authSec = initializeAuth(s, { persistence: inMemoryPersistence }); }
  return authSec;
}
let stMod = null;
async function storage() {
  if (!stMod) {
    const m = await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js');
    stMod = { s: m.getStorage(app), ref: m.ref, uploadBytesResumable: m.uploadBytesResumable, getDownloadURL: m.getDownloadURL, deleteObject: m.deleteObject };
  }
  return stMod;
}
const ref = p => (p.length % 2 ? collection(db, ...p) : doc(db, ...p));
const conFiltros = (p, w) => { const r = ref(p); return w && w.length ? query(r, ...w.map(x => where(x[0], x[1], x[2]))) : r; };
const aLista = s => (s.docs ? s.docs.map(d => ({ ...d.data(), id: d.id })) : (s.exists() ? [{ ...s.data(), id: s.id }] : []));

window.FB = {
  superUid: SUPER_UID,
  onUser: cb => onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email } : null)),
  login: (email, pass) => signInWithEmailAndPassword(auth, email, pass),
  logout: () => signOut(auth),
  reset: email => sendPasswordResetEmail(auth, email),
  async crearCuenta(email, pass) {
    const a = secundaria();
    const c = await createUserWithEmailAndPassword(a, email, pass);
    const id = c.user.uid; await signOut(a); return id;
  },
  sub: (p, w, cb, err) => onSnapshot(conFiltros(p, w), s => cb(aLista(s)), err),
  async get(p) { const s = await getDoc(ref(p)); return s.exists() ? { ...s.data(), id: s.id } : null; },
  async list(p, w) { return aLista(await getDocs(conFiltros(p, w))); },
  set: (p, data) => setDoc(ref(p), data),
  merge: (p, data) => setDoc(ref(p), data, { merge: true }),
  async batchMerge(items) {
    for (let i = 0; i < items.length; i += 400) {
      const b = writeBatch(db);
      items.slice(i, i + 400).forEach(([p, d]) => b.set(ref(p), d, { merge: true }));
      await b.commit();
    }
  },
  // Archivos de los alumnos (Firebase Storage). Se carga solo cuando se usa.
  async subir(ruta, file, avance) {
    const st = await storage();
    const r = st.ref(st.s, ruta);
    const task = st.uploadBytesResumable(r, file, { contentType: file.type || 'application/octet-stream' });
    await new Promise((res, rej) => task.on('state_changed', s => avance && avance(s.bytesTransferred / s.totalBytes), rej, res));
    return st.getDownloadURL(r);
  },
  async borrarArchivo(ruta) {
    try { const st = await storage(); await st.deleteObject(st.ref(st.s, ruta)); } catch (e) { console.warn('No se borró el archivo', ruta, e); }
  },
  del: p => deleteDoc(ref(p)),
  update: (p, data) => updateDoc(ref(p), data),
  async count(p, w) { const s = await getCountFromServer(conFiltros(p, w)); return s.data().count; },
  async batchSet(items, avance) {
    for (let i = 0; i < items.length; i += 400) {
      const b = writeBatch(db);
      items.slice(i, i + 400).forEach(([p, d]) => b.set(ref(p), d));
      await b.commit();
      if (avance) avance(Math.min(i + 400, items.length), items.length);
    }
  }
};
window.dispatchEvent(new Event('fb-listo'));
</script>
